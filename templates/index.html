<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask me anything</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f2f0eb;
            --ink: #0a0a0a;
            --muted: #6b6b6b;
            --rule: 3px solid var(--ink);
            --thin: 1px solid var(--ink);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
            font-size: 15px;
            line-height: 1.55;
            padding: 48px 16px;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            border: var(--rule);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 16px 20px;
            border-bottom: var(--rule);
        }

        h1 {
            font-size: clamp(22px, 5vw, 34px);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .meta { color: var(--muted); font-size: 12px; text-transform: uppercase; }

        section { padding: 20px; }
        section + section { border-top: var(--rule); }

        .label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 120px;
            padding: 14px;
            background: #fff;
            color: var(--ink);
            border: var(--thin);
            font: inherit;
            resize: vertical;
        }

        textarea:focus { outline: var(--rule); outline-offset: -3px; }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-top: 14px;
        }

        .hint { color: var(--muted); font-size: 12px; }

        button {
            background: var(--ink);
            color: var(--paper);
            border: var(--rule);
            padding: 12px 22px;
            font: inherit;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
        }

        button:hover { background: var(--paper); color: var(--ink); }
        button:disabled { cursor: wait; background: var(--paper); color: var(--muted); border-color: var(--muted); }

        .output { white-space: pre-wrap; word-wrap: break-word; }
        .error { color: #b00000; }

        figure img {
            display: block;
            width: 100%;
            height: auto;
            border: var(--thin);
        }

        figcaption { margin-top: 10px; font-size: 12px; }
        figcaption a { color: var(--ink); }

        @media (max-width: 520px) {
            body { padding: 16px; }
            .row { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Ask_me_anything</h1>
            <span class="meta">gpt-4.1 + gpt-image-1</span>
        </header>

        <section>
            <form method="POST" id="ask">
                <label class="label" for="prompt">&gt; Prompt</label>
                <textarea id="prompt" name="prompt" required placeholder="Type something...">{{ prompt }}</textarea>
                <div class="row">
                    <span class="hint">Returns text + image. Takes ~30s.</span>
                    <button type="submit" id="submit">Submit &rarr;</button>
                </div>
            </form>
        </section>

        {% if result %}
        <section>
            <span class="label">001 / Response</span>
            <p class="output{% if result.startswith('Error:') %} error{% endif %}">{{ result }}</p>
        </section>
        {% endif %}

        {% if image or image_error %}
        <section>
            <span class="label">002 / Image</span>
            {% if image %}
            <figure>
                <img src="data:image/png;base64,{{ image }}" alt="Generated image for: {{ prompt }}">
                <figcaption><a href="data:image/png;base64,{{ image }}" download="image.png">[ Download PNG ]</a></figcaption>
            </figure>
            {% else %}
            <p class="output error">{{ image_error }}</p>
            {% endif %}
        </section>
        {% endif %}
    </main>

    <script>
        // Show a working state while the server waits on OpenAI
        document.getElementById("ask").addEventListener("submit", function () {
            var btn = document.getElementById("submit");
            btn.disabled = true;
            btn.textContent = "Generating...";
        });
    </script>
</body>
</html>
